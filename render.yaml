services:
  - type: web
    name: b2b-lead-gen
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadgen-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: leadgen-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: APP_URL
        value: https://b2b-lead-gen.onrender.com

databases:
  - name: leadgen-db
    plan: free
    databaseName: leadgen
    user: leadgen

redis:
  - name: leadgen-redis
    plan: free
    ipAllowList: []
