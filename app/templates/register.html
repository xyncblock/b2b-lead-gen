{% extends "base.html" %}

{% block title %}Register - B2B Lead Generator{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center mb-6">Get Started</h2>
        <form hx-post="/api/auth/register" hx-swap="none" @htmx:after-request="handleRegister(event)">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                    Email
                </label>
                <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-purple-500"
                       type="email" id="email" name="email" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                    Password
                </label>
                <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-purple-500"
                       type="password" id="password" name="password" required minlength="6">
            </div>
            <button type="submit" class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700">
                Create Account
            </button>
        </form>
        <p class="text-center mt-4 text-gray-600">
            Already have an account? <a href="/login" class="text-purple-600">Login</a>
        </p>
    </div>
</div>

<script>
function handleRegister(event) {
    const response = event.detail.xhr;
    if (response.status === 200) {
        alert('Registration successful! Please login.');
        window.location.href = '/login';
    } else {
        const data = JSON.parse(response.responseText);
        alert(data.detail || 'Registration failed.');
    }
}
</script>
{% endblock %}
