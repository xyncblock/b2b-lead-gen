<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}B2B Lead Generator{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="gradient-bg text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold">🎯 B2B Lead Gen</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/businesses" class="hover:text-gray-200">My Businesses</a>
                    <a href="/login" class="hover:text-gray-200">Login</a>
                    <a href="/register" class="bg-white text-purple-600 px-4 py-2 rounded-lg hover:bg-gray-100">Get Started</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <p class="text-center text-sm">B2B Lead Generator - Internal Tool</p>
        </div>
    </footer>
</body>
</html>
